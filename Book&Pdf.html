<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Premium Glass UI</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

<style>
:root{
  --glass-light: rgba(255,255,255,0.25);
  --glass-dark: rgba(255,255,255,0.08);
  --border-light: rgba(255,255,255,0.4);
  --border-dark: rgba(255,255,255,0.15);
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins',sans-serif;
}

body{
  min-height:100vh;
  background:#eef1ff;
  overflow-x:hidden;
  transition:.4s;
}

body.dark{
  background:#0f1220;
}

/* 🔮 Animated background blobs */
.blob{
  position:fixed;
  width:320px;
  height:320px;
  filter:blur(80px);
  opacity:.6;
  animation: float 12s infinite alternate ease-in-out;
  z-index:-1;
}

.blob.one{
  background:#7f8cff;
  top:10%;
  left:5%;
}
.blob.two{
  background:#ff8c00;
  bottom:10%;
  right:5%;
}
.blob.three{
  background:#25d9c8;
  top:40%;
  right:25%;
}

@keyframes float{
  from{transform:translateY(0) translateX(0);}
  to{transform:translateY(-80px) translateX(60px);}
}

/* 🌙 Toggle */
.toggle{
  position:fixed;
  top:20px;
  right:20px;
  padding:10px 14px;
  border-radius:50px;
  background:var(--glass-light);
  backdrop-filter:blur(12px);
  border:1px solid var(--border-light);
  cursor:pointer;
  z-index:100;
}

body.dark .toggle{
  background:var(--glass-dark);
  border-color:var(--border-dark);
  color:#fff;
}

/* 📦 Container */
.container{
  max-width:760px;
  margin:auto;
  padding:110px 16px 40px;
}

/* 🧊 Glass Card */
.card{
  position:relative;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:34px 40px;
  margin-bottom:28px;
  border-radius:28px;
  background:var(--glass-light);
  backdrop-filter:blur(18px);
  border:1px solid var(--border-light);
  box-shadow:0 30px 60px rgba(0,0,0,.2);
  color:#fff;
  overflow:hidden;
  cursor:pointer;
}

body.dark .card{
  background:var(--glass-dark);
  border-color:var(--border-dark);
}

.card::after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(120deg,rgba(255,255,255,.25),transparent);
  opacity:.3;
}

.card:hover{
  transform:translateY(-6px) scale(1.02);
}

.text h2{
  font-size:30px;
  letter-spacing:1px;
}

.text p{
  font-size:14px;
  opacity:.85;
  margin-top:6px;
}

.icon{
  font-size:72px;
  opacity:.9;
}

/* 🎨 Gradient overlays */
.scan{background-image:linear-gradient(135deg,#8caeff,#5465ff);}
.courses{background-image:linear-gradient(135deg,#ffc98c,#fa8b41);}

/* 💧 Ripple */
.ripple{
  position:absolute;
  border-radius:50%;
  transform:scale(0);
  background:rgba(255,255,255,.6);
  animation:ripple .6s linear;
}

@keyframes ripple{
  to{
    transform:scale(4);
    opacity:0;
  }
}

@media(max-width:600px){
  .container{max-width:420px;}
  .icon{font-size:60px;}
  .text h2{font-size:24px;}
}
/* 🦸 Website Logo */
.logo{
  position: fixed;
  top: 20px;
  left: 20px;
  font-size: 22px;
  font-weight: 600;
  letter-spacing: 2px;
  color: #111;
  padding: 8px 16px;
  border-radius: 50px;
  background: var(--glass-light);
  backdrop-filter: blur(12px);
  border: 1px solid var(--border-light);
  z-index: 100;
}

body.dark .logo{
  color: #fff;
  background: var(--glass-dark);
  border-color: var(--border-dark);
}
/* 🔻 Premium Glass Footer Bar */
.footer-bar{
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  width: calc(100% - 40px);
  max-width: 420px;
  height: 68px;

  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 0 22px;

  background: var(--glass-light);
  backdrop-filter: blur(18px);
  border-radius: 26px;
  border: 1px solid var(--border-light);
  box-shadow: 0 18px 45px rgba(0,0,0,0.25);

  z-index: 100;
}

body.dark .footer-bar{
  background: var(--glass-dark);
  border-color: var(--border-dark);
}

/* Footer buttons */
.footer-item{
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  font-size: 11px;
  color: #111;
  cursor: pointer;
  user-select: none;
  transition: .3s;
}

.footer-item span{
  font-size: 20px;
}

body.dark .footer-item{
  color: #fff;
}

.footer-item:hover{
  transform: translateY(-4px);
  opacity: .9;
}

.footer-item.active{
  font-weight: 600;
}

.footer-icon{
  width:40px;
  height:40px;
  object-fit:contain;
}

.footer-item.active .footer-icon{
  filter: drop-shadow(0 0 6px rgba(127,140,255,0.7));
}

.footer-item a{
  text-decoration:none;
  color:inherit;
}

</style>
</head>

<body>

<div class="logo">RANJIT</div>
<div class="blob one"></div>
<div class="blob two"></div>
<div class="blob three"></div>

<div class="toggle" onclick="toggleMode()">🌙</div>

<div class="container">

  <a href="study.html" style="text-decoration: none; color: inherit; display: block;">
  <div class="card scan">
    <div class="text">
      <h2>Study Books</h2>
      <p>The Knowledge Chronology</p>
    </div>
    <div class="icon">🧠</div>
  </div>
</a>

<a href="comic.html" style="text-decoration: none; color: inherit; display: block;">
  <div class="card courses">
    <div class="text">
      <h2>Comic Books</h2>
      <p>Alternate Realities & Heroic Tales</p>
    </div>
    <div class="icon">🎃</div>
  </div>
</a>


  
</div>

<script>
const body=document.body;
const toggle=document.querySelector('.toggle');

if(localStorage.getItem('mode')==='dark'){
  body.classList.add('dark');
  toggle.textContent='☀️';
}

function toggleMode(){
  body.classList.toggle('dark');
  const dark=body.classList.contains('dark');
  toggle.textContent=dark?'☀️':'🌙';
  localStorage.setItem('mode',dark?'dark':'light');
}

/* Ripple effect */
document.querySelectorAll('.card').forEach(card=>{
  card.addEventListener('click',e=>{
    const circle=document.createElement('span');
    circle.classList.add('ripple');
    const size=Math.max(card.clientWidth,card.clientHeight);
    circle.style.width=circle.style.height=size+'px';
    circle.style.left=e.offsetX-size/2+'px';
    circle.style.top=e.offsetY-size/2+'px';
    card.appendChild(circle);
    setTimeout(()=>circle.remove(),600);
  });
});
</script>

<footer class="footer-bar">
  <div class="footer-item">
  <a href="index.html">
    <span>
      <img src="image/back.png" class="footer-icon">
    </span>
  </a>
</div>


  <div class="footer-item active">
    <a href="index.html">
    <span>
      <img src="image/home.png" class="footer-icon">
    </span>
  </a>
    
  </div>

  <div class="footer-item">
   <a href="mailto:rd687723@gmail.com">
    <span>
      <img src="image/mail.png" class="footer-icon">
    </span>
  </a>
  </div>

  <div class="footer-item">
    <a href="about.html">
    <span>
      <img src="image/about.png" class="footer-icon">
    </span>
  </a>
  </div>

</footer>

</body>
</html>
