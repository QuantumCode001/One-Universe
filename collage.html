<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Oops! Something Went Wrong</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

<style>
:root{
  --glass-light: rgba(255,255,255,0.25);
  --glass-dark: rgba(255,255,255,0.08);
  --border-light: rgba(255,255,255,0.4);
  --border-dark: rgba(255,255,255,0.15);
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins',sans-serif;
}

body{
  min-height:100vh;
  background:#eef1ff;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:.4s;
  overflow:hidden;
}

body.dark{
  background:#0f1220;
}

/* 🔮 Background blobs */
.blob{
  position:fixed;
  width:320px;
  height:320px;
  filter:blur(80px);
  opacity:.6;
  animation: float 12s infinite alternate ease-in-out;
  z-index:-1;
}

.blob.one{background:#7f8cff; top:10%; left:5%;}
.blob.two{background:#ff8c00; bottom:10%; right:5%;}
.blob.three{background:#25d9c8; top:40%; right:25%;}

@keyframes float{
  from{transform:translate(0,0);}
  to{transform:translate(60px,-80px);}
}

/* 🦸 Website Logo */
.logo{
  position: fixed;
  top: 20px;
  left: 20px;
  font-size: 22px;
  font-weight: 600;
  letter-spacing: 2px;
  color: #111;
  padding: 8px 16px;
  border-radius: 50px;
  background: var(--glass-light);
  backdrop-filter: blur(12px);
  border: 1px solid var(--border-light);
  z-index: 100;
}

body.dark .logo{
  color: #fff;
  background: var(--glass-dark);
  border-color: var(--border-dark);
}

/* 🌙 Toggle */
.toggle{
  position:fixed;
  top:20px;
  right:20px;
  padding:10px 14px;
  border-radius:50px;
  background:var(--glass-light);
  backdrop-filter:blur(12px);
  border:1px solid var(--border-light);
  cursor:pointer;
  z-index:100;
}

body.dark .toggle{
  background:var(--glass-dark);
  border-color:var(--border-dark);
  color:#fff;
}

/* 🎓 Predictor Section */
.predictor-section{
  margin-top:40px;
}

.section-title{
  text-align:center;
  margin-bottom:24px;
  letter-spacing:2px;
  font-size:22px;
  color:#111;
}

body.dark .section-title{
  color:#fff;
}

/* Grid */
.predictor-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:20px;
}

/* Predictor Card */
.predictor-card{
  padding:26px 18px;
  border-radius:24px;
  text-align:center;
  text-decoration:none;
  color:#111;
  background:var(--glass-light);
  backdrop-filter:blur(18px);
  border:1px solid var(--border-light);
  box-shadow:0 25px 50px rgba(0,0,0,.2);
  transition:.4s;
  position:relative;
  overflow:hidden;
}

body.dark .predictor-card{
  background:var(--glass-dark);
  border-color:var(--border-dark);
  color:#fff;
}

.predictor-card::after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(120deg,rgba(255,255,255,.25),transparent);
  opacity:.3;
}

.predictor-card:hover{
  transform:translateY(-8px) scale(1.04);
}

/* Icon */
.exam-icon{
  font-size:42px;
  margin-bottom:12px;
}

/* Text */
.predictor-card h3{
  font-size:20px;
  letter-spacing:1px;
}

.predictor-card p{
  font-size:12px;
  opacity:.85;
  margin-top:6px;
}

/* 🎨 Exam Colors */
.wbjee{background-image:linear-gradient(135deg,#8087dc,#3246ff);}
.neet{background-image:linear-gradient(135deg,#8cff8e,#41fa6f);}
.jee{background-image:linear-gradient(135deg,#ffb347,#ff8c00);}

/* 📱 Responsive */
@media(max-width:700px){
  .predictor-grid{
    grid-template-columns:1fr;
  }
}

/* Footer bar */
.footer-bar{
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  width:calc(100% - 40px);
  max-width:420px;
  height:68px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:0 22px;
  background:var(--glass-light);
  backdrop-filter:blur(18px);
  border-radius:26px;
  border:1px solid var(--border-light);
  box-shadow:0 18px 45px rgba(0,0,0,.25);
}
body.dark .footer-bar{
  background:var(--glass-dark);
  border-color:var(--border-dark);
}

.footer-item{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:4px;
  font-size:11px;
  cursor:pointer;
  transition:.3s;
}
.footer-item span{font-size:20px;}
.footer-item:hover{transform:translateY(-4px);}
body.dark .footer-item{color:#fff;}

.footer-icon{
  width:40px;
  height:40px;
  object-fit:contain;
}

.footer-item.active .footer-icon{
  filter: drop-shadow(0 0 6px rgba(127,140,255,0.7));
}

.footer-item a{
  text-decoration:none;
  color:inherit;
}
</style>
</head>

<body>

<div class="logo">RANJIT</div>
<div class="blob one"></div>
<div class="blob two"></div>
<div class="blob three"></div>

<div class="toggle" onclick="toggleMode()">🌙</div>

<!-- 🎓 College Predictor Section -->
<div class="predictor-section">
  <h2 class="section-title">COLLEGE PREDICTOR</h2>

  <div class="predictor-grid">

    <a href="wpredict.html" class="predictor-card wbjee">
      <div class="exam-icon">🎓</div>
      <h3>WBJEE</h3>
      <p>West Bengal Joint Entrance Examination</p>
    </a>

    <a href="jpredict.html" class="predictor-card jee">
      <div class="exam-icon">⚙️</div>
      <h3>JEE MAIN</h3>
      <p>Joint Entrance Examination</p>
    </a>

    <a href="sorry.html" class="predictor-card neet">
      <div class="exam-icon">🩺</div>
      <h3>NEET</h3>
      <p>National Eligibility cum Entrance Test</p>
    </a>

  </div>
</div>

<!-- FOOTER -->
  <!-- FOOTER -->
<footer class="footer-bar">
  <div class="footer-item">
  <a href="index.html">
    <span>
      <img src="image/back.png" class="footer-icon">
    </span>
  </a>
</div>


  <div class="footer-item active">
    <a href="index.html">
    <span>
      <img src="image/home.png" class="footer-icon">
    </span>
  </a>
    
  </div>

  <div class="footer-item">
   <a href="mailto:rd687723@gmail.com">
    <span>
      <img src="image/mail.png" class="footer-icon">
    </span>
  </a>
  </div>

  <div class="footer-item">
    <a href="about.html">
    <span>
      <img src="image/about.png" class="footer-icon">
    </span>
  </a>
  </div>

</footer>

<script>
const body=document.body;
const toggle=document.querySelector('.toggle');

if(localStorage.getItem('mode')==='dark'){
  body.classList.add('dark');
  toggle.textContent='☀️';
}

function toggleMode(){
  body.classList.toggle('dark');
  const dark=body.classList.contains('dark');
  toggle.textContent=dark?'☀️':'🌙';
  localStorage.setItem('mode',dark?'dark':'light');
}
</script>

</body>
</html>
