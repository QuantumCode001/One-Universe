<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Premium Glass UI – Book Shelf</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

<style>
:root{
  --glass-light: rgba(255,255,255,0.25);
  --glass-dark: rgba(255,255,255,0.08);
  --border-light: rgba(255,255,255,0.4);
  --border-dark: rgba(255,255,255,0.15);
}

*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}

body{
  min-height:100vh;
  background:#eef1ff;
  overflow-x:hidden;
  transition:.4s;
}
body.dark{background:#0f1220;}

/* Background blobs */
.blob{
  position:fixed;width:320px;height:320px;
  filter:blur(80px);opacity:.6;
  animation: float 12s infinite alternate ease-in-out;
  z-index:-1;
}
.blob.one{background:#7f8cff;top:10%;left:5%;}
.blob.two{background:#ff8c00;bottom:10%;right:5%;}
.blob.three{background:#25d9c8;top:40%;right:25%;}

@keyframes float{
  from{transform:translate(0,0);}
  to{transform:translate(60px,-80px);}
}

/* Toggle */
.toggle{
  position:fixed;top:20px;right:20px;
  padding:10px 14px;border-radius:50px;
  background:var(--glass-light);
  backdrop-filter:blur(12px);
  border:1px solid var(--border-light);
  cursor:pointer;z-index:100;
}
body.dark .toggle{background:var(--glass-dark);border-color:var(--border-dark);color:#fff;}

.logo{
  position:fixed;top:20px;left:20px;
  padding:8px 16px;border-radius:50px;
  background:var(--glass-light);
  backdrop-filter:blur(12px);
  border:1px solid var(--border-light);
  font-weight:600;letter-spacing:2px;
}
body.dark .logo{background:var(--glass-dark);border-color:var(--border-dark);color:#fff;}

.container{
  max-width:760px;
  margin:auto;
  padding:120px 16px 120px;
  display:grid;
  grid-template-columns: repeat(auto-fit,minmax(220px,1fr));
  gap:26px;
}

/* 📱 APP CARD */
.app-card{
  position:relative;
  height:260px;
  border-radius:26px;
  background:var(--glass-light);
  backdrop-filter:blur(18px);
  border:1px solid var(--border-light);
  box-shadow:0 30px 60px rgba(0,0,0,.25);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:14px;
  cursor:pointer;
  transition:.2s ease;
}

.app-card:hover{
  transform:translateY(-6px);
}

.app-card:active{
  transform:scale(0.96);
  box-shadow:0 14px 30px rgba(127,140,255,.5);
}

/* App logo */
.app-logo{
  width:80px;
  height:80px;
  border-radius:22px;
  background:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:0 12px 30px rgba(0,0,0,.3);
}

.app-logo img{
  width:60%;
}

/* App text */
.app-info{
  text-align:center;
  color:#fff;
}

.app-info h3{
  font-size:18px;
  font-weight:600;
}

.app-info p{
  font-size:12px;
  opacity:.85;
}

/* App tag */
.app-tag{
  padding:4px 12px;
  border-radius:50px;
  font-size:11px;
  background:rgba(255,255,255,.2);
}


/* hover stays subtle */
.book-card:hover{
  transform: translateY(-4px);
}

/* 👆 SIMPLE CLICK ANIMATION */
.book-card:active{
  transform: scale(0.97);
  box-shadow:0 15px 30px rgba(0,0,0,.2);
}

/* 📘 Book click animation */
.book-card:active{
  transform: scale(0.96) rotateY(-6deg) rotateX(4deg);
  box-shadow: 0 12px 30px rgba(0,0,0,.35);
}

/* Glow pulse */
.book-card.clicked{
  animation: bookPop 0.45s ease;
}

@keyframes bookPop{
  0%{
    transform: scale(1) rotateY(0);
    box-shadow: 0 30px 60px rgba(0,0,0,.25);
  }
  50%{
    transform: scale(0.95) rotateY(-8deg);
    box-shadow: 0 15px 35px rgba(127,140,255,.6);
  }
  100%{
    transform: scale(1) rotateY(0);
    box-shadow: 0 30px 60px rgba(0,0,0,.25);
  }
}

/* Book spine */
.book-card::before{
  content:"";
  position:absolute;
  left:0;top:0;
  width:16px;height:100%;
  background:rgba(0,0,0,.25);
}

/* Cover image */
.book-cover{
  height:68%;
  background-size:cover;
  background-position:center;
}

/* Book text */
.book-info{
  padding:14px;
  color:#fff;
}
.book-info h3{
  font-size:18px;
  margin-bottom:4px;
}
.book-info p{
  font-size:12px;
  opacity:.85;
}

/* More card */
.more{
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:22px;
  font-weight:600;
}

/* Footer bar */
.footer-bar{
  position:fixed;
  bottom:20px;left:50%;
  transform:translateX(-50%);
  width:calc(100% - 40px);
  max-width:420px;height:68px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:0 22px;
  background:var(--glass-light);
  backdrop-filter:blur(18px);
  border-radius:26px;
  border:1px solid var(--border-light);
  box-shadow:0 18px 45px rgba(0,0,0,.25);
}
body.dark .footer-bar{background:var(--glass-dark);border-color:var(--border-dark);}

.footer-item{
  text-align:center;
  font-size:11px;
  cursor:pointer;
  transition:.3s;
}
.footer-item span{font-size:20px;}
.footer-item:hover{transform:translateY(-4px);}
body.dark .footer-item{color:#fff;}

.footer-icon{
  width:40px;
  height:40px;
  object-fit:contain;
}

.footer-item.active .footer-icon{
  filter: drop-shadow(0 0 6px rgba(127,140,255,0.7));
}

.footer-item a{
  text-decoration:none;
  color:inherit;
}

</style>
</head>

<body>

<div class="logo">RANJIT</div>
<div class="blob one"></div>
<div class="blob two"></div>
<div class="blob three"></div>

<!-- 📱 APP SECTION -->

  <div class="app-card">
    <div class="app-logo">
      <img src="https://cdn-icons-png.flaticon.com/512/5968/5968292.png">
    </div>
    <div class="app-info">
      <h3>Chrome</h3>

    </div>

  </div>

  <div class="app-card">

      <img src="https://cdn-icons-png.flaticon.com/512/174/174857.png">
    </div>
    <div class="app-info">
      <h3>LinkedIn</h3>
      <p>Professional Network</p>
    </div>
    <div class="app-tag">Social</div>
  </div>

  <div class="app-card">
    <div class="app-logo">
      <img src="https://cdn-icons-png.flaticon.com/512/5968/5968520.png">
    </div>
    <div class="app-info">
      <h3>Photoshop</h3>
      <p>Design & Editing</p>
    </div>
    <div class="app-tag">Creative</div>
  </div>

  <div class="app-card">
    <h2 style="color:#fff">＋ More Apps</h2>
  </div>

</div>


<!-- FOOTER -->
<footer class="footer-bar">
  <div class="footer-item">
  <a href="app.html">
    <span>
      <img src="image/back.png" class="footer-icon">
    </span>
  </a>
</div>


  <div class="footer-item active">
    <a href="index.html">
    <span>
      <img src="image/home.png" class="footer-icon">
    </span>
  </a>
    
  </div>

  <div class="footer-item">
   <a href="mailto:rd687723@gmail.com">
    <span>
      <img src="image/mail.png" class="footer-icon">
    </span>
  </a>
  </div>

  <div class="footer-item">
    <a href="about.html">
    <span>
      <img src="image/about.png" class="footer-icon">
    </span>
  </a>
  </div>

</footer>

<script>
const body=document.body;
const toggle=document.querySelector('.toggle');

if(localStorage.getItem('mode')==='dark'){
  body.classList.add('dark');
  toggle.textContent='☀️';
}

function toggleMode(){
  body.classList.toggle('dark');
  toggle.textContent=body.classList.contains('dark')?'☀️':'🌙';
  localStorage.setItem('mode',body.classList.contains('dark')?'dark':'light');
}
</script>

</body>
</html>
