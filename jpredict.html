<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Oops! Something Went Wrong</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

<style>
:root{
  --glass-light: rgba(255,255,255,0.25);
  --glass-dark: rgba(255,255,255,0.08);
  --border-light: rgba(255,255,255,0.4);
  --border-dark: rgba(255,255,255,0.15);
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins',sans-serif;
}

body{
  min-height:100vh;
  background:#eef1ff;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:.4s;
  overflow:hidden;
}

body.dark{
  background:#0f1220;
}

/* 🔮 Background blobs */
.blob{
  position:fixed;
  width:320px;
  height:320px;
  filter:blur(80px);
  opacity:.6;
  animation: float 12s infinite alternate ease-in-out;
  z-index:-1;
}

.blob.one{background:#7f8cff; top:10%; left:5%;}
.blob.two{background:#ff8c00; bottom:10%; right:5%;}
.blob.three{background:#25d9c8; top:40%; right:25%;}

@keyframes float{
  from{transform:translate(0,0);}
  to{transform:translate(60px,-80px);}
}

/* 🦸 Website Logo */
.logo{
  position: fixed;
  top: 20px;
  left: 20px;
  font-size: 22px;
  font-weight: 600;
  letter-spacing: 2px;
  color: #111;
  padding: 8px 16px;
  border-radius: 50px;
  background: var(--glass-light);
  backdrop-filter: blur(12px);
  border: 1px solid var(--border-light);
  z-index: 100;
}

body.dark .logo{
  color: #fff;
  background: var(--glass-dark);
  border-color: var(--border-dark);
}

/* 🌙 Toggle */
.toggle{
  position:fixed;
  top:20px;
  right:20px;
  padding:10px 14px;
  border-radius:50px;
  background:var(--glass-light);
  backdrop-filter:blur(12px);
  border:1px solid var(--border-light);
  cursor:pointer;
  z-index:100;
}

body.dark .toggle{
  background:var(--glass-dark);
  border-color:var(--border-dark);
  color:#fff;
}

/* 🎓 Predictor Section */
.predictor-section{
  margin-top:40px;
}

.section-title{
  text-align:center;
  margin-bottom:20px;
  letter-spacing:2px;
  font-size:22px;
  color:#111;
}

body.dark .section-title{color:#fff;}

/* Glass base */
.glass{
  background:var(--glass-light);
  backdrop-filter:blur(18px);
  border:1px solid var(--border-light);
  border-radius:24px;
  box-shadow:0 25px 50px rgba(0,0,0,.25);
}

body.dark .glass{
  background:var(--glass-dark);
  border-color:var(--border-dark);
}

/* Inputs */
.predictor-input{
  display:flex;
  gap:12px;
  padding:20px;
  flex-wrap:wrap;
}

.predictor-input input,
.predictor-input select{
  flex:1;
  padding:14px 16px;
  border-radius:14px;
  border:none;
  outline:none;
  font-size:14px;
}

.predictor-input button{
  padding:14px 22px;
  border-radius:16px;
  border:none;
  cursor:pointer;
  background:linear-gradient(135deg,#7f8cff,#b38cff);
  color:#fff;
  font-weight:600;
}

/* Result */
.predictor-result{
  margin-top:22px;
  padding:22px;
}

.college-card{
  padding:18px;
  border-radius:18px;
  margin-bottom:14px;
  background:rgba(255,255,255,.18);
  border:1px solid rgba(255,255,255,.3);
  position:relative;
  overflow:hidden;
}

body.dark .college-card{
  background:rgba(255,255,255,.06);
}

.college-card h4{
  font-size:16px;
}

.college-card span{
  font-size:12px;
  opacity:.85;
}

/* 💧 Ripple */
.ripple{
  position:absolute;
  border-radius:50%;
  transform:scale(0);
  background:rgba(255,255,255,.6);
  animation:ripple .6s linear;
}

@keyframes ripple{
  to{
    transform:scale(4);
    opacity:0;
  }
}

/* Mobile */
@media(max-width:600px){
  .predictor-input{flex-direction:column;}
}


/* Footer bar */
.footer-bar{
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  width:calc(100% - 40px);
  max-width:420px;
  height:68px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:0 22px;
  background:var(--glass-light);
  backdrop-filter:blur(18px);
  border-radius:26px;
  border:1px solid var(--border-light);
  box-shadow:0 18px 45px rgba(0,0,0,.25);
}
body.dark .footer-bar{
  background:var(--glass-dark);
  border-color:var(--border-dark);
}

.footer-item{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:4px;
  font-size:11px;
  cursor:pointer;
  transition:.3s;
}
.footer-item span{font-size:20px;}
.footer-item:hover{transform:translateY(-4px);}
body.dark .footer-item{color:#fff;}

.footer-icon{
  width:40px;
  height:40px;
  object-fit:contain;
}

.footer-item.active .footer-icon{
  filter: drop-shadow(0 0 6px rgba(127,140,255,0.7));
}

.footer-item a{
  text-decoration:none;
  color:inherit;
}

.predictor-input button{
  transition: transform 0.15s ease, box-shadow 0.15s ease;
}

.predictor-input button:active{
  transform: scale(0.94);
  box-shadow: 0 8px 20px rgba(0,0,0,0.25);
}

.predictor-input button:active{
  transform: scale(0.94);
  box-shadow: 0 0 18px rgba(127,140,255,0.7);
}


</style>
</head>

<body>

<div class="logo">RANJIT</div>
<div class="blob one"></div>
<div class="blob two"></div>
<div class="blob three"></div>

<div class="toggle" onclick="toggleMode()">🌙</div>

<!-- 🎓 College Predictor Section -->
<!-- 🎓 College Predictor -->
<div class="predictor-section">
  <h2 class="section-title">COLLEGE PREDICTOR</h2>

  <!-- Inputs -->
  <div class="predictor-input glass">
    <input type="number" id="rank" placeholder="Enter your Rank">
    
    <select id="branch">
      <option value="CSE">CSE</option>
      <option value="IT">IT</option>
      <option value="ECE">ECE</option>
      <option value="EE">EE</option>
    </select>

    <button onclick="predictCollege(event)">Predict</button>
  </div>

  <!-- Result -->
  <div class="predictor-result glass" id="result">
    <p class="placeholder">Enter details to see predicted colleges</p>
  </div>
</div>

  <!-- FOOTER -->
<footer class="footer-bar">
  <div class="footer-item">
  <a href="collage.html">
    <span>
      <img src="image/back.png" class="footer-icon">
    </span>
  </a>
</div>


  <div class="footer-item active">
    <a href="index.html">
    <span>
      <img src="image/home.png" class="footer-icon">
    </span>
  </a>
    
  </div>

  <div class="footer-item">
   <a href="mailto:rd687723@gmail.com">
    <span>
      <img src="image/mail.png" class="footer-icon">
    </span>
  </a>
  </div>

  <div class="footer-item">
    <a href="about.html">
    <span>
      <img src="image/about.png" class="footer-icon">
    </span>
  </a>
  </div>

</footer>


<script>
const body = document.body;
const toggle = document.querySelector('.toggle');

/* Load saved theme */
if (localStorage.getItem('mode') === 'dark') {
  body.classList.add('dark');
  toggle.textContent = '☀️';
}

/* Toggle dark mode */
function toggleMode() {
  body.classList.toggle('dark');
  const isDark = body.classList.contains('dark');
  toggle.textContent = isDark ? '☀️' : '🌙';
  localStorage.setItem('mode', isDark ? 'dark' : 'light');
}

/* 🎯 College Predictor */
function predictCollege() {
  const rank = document.getElementById('rank').value;
  const branch = document.getElementById('branch').value;
  const result = document.getElementById('result');

  if (!rank) {
    result.innerHTML = `<p>Please enter your rank</p>`;
    return;
  }

  let colleges = [];

  if (rank < 10000) {
    colleges = [
      "IIT Level College",
      "Top Government College",
      "Premium University"
    ];
  } else if (rank < 40000) {
    colleges = [
      "State Government College",
      "Top Private College",
      "Autonomous Institute"
    ];
  } else {
    colleges = [
      "Private College",
      "Regional Institute",
      "Affiliated College"
    ];
  }

  result.innerHTML = colleges.map(col => `
    <div class="college-card">
      <h4>${col}</h4>
      <span>Branch: ${branch}</span>
    </div>
  `).join('');
}
</script>



</body>
</html>
